# تحسين خطوة إضافة ونشر العقار

## الملخص
- التركيز في هذه المرحلة سيكون على إصلاح رحلة `/add-property` بالكامل: الحماية المبكرة، التحقق المرحلي، ثبات حالة النموذج، وتجربة النشر عند النجاح أو الفشل.
- ستُضاف مشاكل الـ UX التي ظهرت في المحاكاة إلى نفس التنفيذ، خصوصاً: حقول الأرقام عند الرجوع، ثبات نوع الإيجار، وتوقيت رسائل خطأ الموقع.
- زر `أضف عقارك` في الترويسة تم تأجيله لخطوة لاحقة بناءً على توجيهك، لذلك لن نوسّع الـ header العام في هذه المرحلة.

## التغييرات الأساسية
- في `src/app/add-property/page.tsx`:
  - تغليف الصفحة بـ `ProtectedRoute` واستخدام `useAuth().user` كمصدر الحقيقة لتسجيل الدخول أثناء النشر.
  - إضافة `submitError` ثابت أعلى زر النشر، مع `submitStage` يحدد حالة الزر: `جاري التحضير...` ثم `جاري رفع الصور...` ثم `جاري تسجيل العقار...` ثم `جاري المحاولة مجدداً...` عند الحاجة.
  - إبقاء طبقة النجاح الحالية بعد النشر، مع جعل رسائل الفشل مرئية وثابتة داخل الخطوة 4 بدلاً من الاعتماد على `toast` فقط.
  - منع الانتقال من الخطوة 1 بدون صور، وعرض `imageError` داخل الخطوة نفسها حتى عندما لا توجد أي صورة.
  - إذا وصل المستخدم للنشر بدون صور لأي سبب، يتم إرجاعه تلقائياً للخطوة 1 مع رسالة واضحة.
  - استبدال الحقول الرقمية الحساسة (`price`, `bedrooms`, `bathrooms`, `area`, `floor`) من `type="number"` إلى حقول نصية مع `inputMode="numeric"` وتنقية الإدخال رقمياً أثناء الكتابة، لمنع سلوك الدمج/الزيادة الغريب عند الرجوع بين الخطوات.
  - اعتماد تحديثات حالة أوضح للحقول بحيث تبقى قيمة `priceUnit` ثابتة عند التنقل `التالي/السابق`، مع اختبار انحدار مخصص لمسار “شهري”.
  - تنظيف الأخطاء على مستوى الحقل عند التعديل، بدلاً من بقاء رسالة قديمة بعد أن يبدأ المستخدم التصحيح.
  - جعل خطوة الموقع تعرض إرشاداً محايداً عند الفتح، ولا تعرض حالة خطأ حمراء إلا بعد محاولة المستخدم المتابعة ببيانات غير صالحة أو بعد اختيار نقطة خارج النطاق.

- في `src/components/add-property/LocationPicker.tsx`:
  - فصل النص الإرشادي الافتراضي عن حالة الخطأ الفعلية.
  - عدم إظهار رسالة خطأ حمراء لمجرد عدم اختيار المنطقة بعد؛ تبقى الرسالة الحمراء مرتبطة فقط بـ `locationError` القادم من التحقق بعد محاولة المتابعة.
  - الإبقاء على حدود المنطقة والنقطة المختارة كما هي، لكن مع تقليل الإحساس بأن هناك “خطأ” قبل أي تفاعل.

- في `src/services/supabaseService.ts`:
  - توسيع `createFullProperty` لتقبل وسيط خيارات رابعاً اختياريّاً مثل:
    - `timeoutMs`
    - `maxRetries`
    - `onStageChange`
  - إضافة تصنيف أخطاء واضح يمكن للواجهة قراءته: `AUTH_REQUIRED`, `SESSION_EXPIRED`, `SESSION_MISMATCH`, `REQUEST_TIMEOUT`, `UPLOAD_FAILED`, `PROPERTY_CREATE_FAILED`.
  - عند غياب الجلسة أو عدم تطابقها، محاولة `refreshSession()` مرة واحدة فقط ثم إعادة الفحص قبل الفشل.
  - دعم إبلاغ الواجهة بالمراحل الفعلية من داخل الخدمة، حتى يتطابق نص الزر مع العملية الجارية فعلاً.
  - تطبيق تحمّل محدود وآمن للأعطال المؤقتة، مع تجنب إعادة محاولة الإدخال النهائي بشكل أعمى إذا كان قد يسبب إنشاء عقار مكرر.

## التغييرات على الواجهات العامة
- `supabaseService.createFullProperty(propertyData, imageFiles, userId, options?)`
  - إضافة وسيط `options` اختياري للتحمل ومراحل التنفيذ.
- لا توجد تغييرات عامة على الـ header أو الـ chrome في هذه المرحلة؛ هذا مؤجل لخطوة لاحقة.

## خطة الاختبار
- مستخدم غير مسجل يفتح `/add-property` يتم توجيهه مباشرة إلى تسجيل الدخول مع `redirect=/add-property`.
- الخطوة 1 لا تسمح بالمتابعة بدون صورة، وتعرض الرسالة داخل نفس الخطوة.
- الحقول الرقمية تحتفظ بالقيم الصحيحة عند الانتقال ثم الرجوع، ولا يظهر سلوك `10/11` عند تعديل `0/1`.
- اختيار `priceUnit = month` يبقى ثابتاً عند الانتقال بين الخطوات ويظهر في الملخص النهائي ويرسل بالقيمة نفسها إلى الخدمة.
- خطوة الموقع لا تعرض خطأ أحمر عند فتحها لأول مرة، وتعرض الخطأ فقط بعد محاولة غير صالحة أو عند اختيار نقطة خارج النطاق.
- عند فشل الجلسة أو المهلة أثناء النشر، يعود الزر من التحميل لكن تبقى رسالة الفشل واضحة داخل الخطوة 4.
- عند نجاح النشر، يبقى سلوك النجاح الحالي كما هو.
- اختبارات الخدمة تؤكد محاولة تحديث الجلسة مرة واحدة، وتمرير مراحل التنفيذ، وإرجاع أخطاء مصنفة للواجهة.

## الافتراضات والقرارات المعتمدة
- إصلاح CTA في الترويسة مؤجل لمرحلة لاحقة، ولن يدخل هذا التنفيذ.
- النجاح سيستمر باستخدام واجهة النجاح الحالية، وليس استبدالها بمسار جديد.
- إعادة المحاولة ستكون محدودة ومضبوطة، وليست إعادة نشر عمياء قد تكرر السجل.
# تحسين خطوة نشر العقار

## الملخص
- حماية صفحة `/add-property` مبكراً باستخدام `ProtectedRoute` الموجود بالمشروع، مع اعتماد `useAuth().user` كمصدر الحقيقة للدخول ومعرّف المالك أثناء النشر، والإبقاء على `useUser()` فقط للإثراء وملء بيانات المالك.
- نقل التحقق من الصور إلى مستوى الخطوة 1 نفسها، مع إظهار خطأ مرئي داخل الخطوة وإرجاع المستخدم للخطوة 1 إذا وصل للنشر بدون صور لأي سبب.
- جعل فشل النشر واضحاً ومستداماً في الخطوة 4 عبر `submitError` ثابت فوق زر النشر، مع رسائل مصنفة لأخطاء الجلسة والمهلة والشبكة، والإبقاء على الـ `toast` كقناة ثانوية فقط.
- توسيع `supabaseService.createFullProperty` بدعم تحمّل محدود وآمن: تحديث جلسة مرة واحدة عند انتهاء/عدم تطابق الجلسة، وإبلاغ الواجهة بمراحل التنفيذ، مع تجنب إعادة المحاولة العمياء لإدخال السجل النهائي إذا كان ذلك قد يسبب عقارات مكررة.

## التغييرات الأساسية
- في `src/app/add-property/page.tsx`:
  - تغليف المحتوى داخل `ProtectedRoute` بنفس نمط صفحة `my-properties`.
  - إضافة `useAuth()` واستخدام `authContextUser.id` في `handleSubmit` بدلاً من الاعتماد على `useUser()` وحده.
  - إضافة `submitError` و`submitStage` بحالات واضحة: `idle`, `preparing`, `uploading_images`, `creating_record`, `retrying`.
  - نقل عنصر `imageError` ليظهر دائماً في الخطوة 1 حتى عندما تكون قائمة الصور فارغة.
  - تعديل `handleNextStep` بحيث يمنع الانتقال من الخطوة 1 إذا `stagedImages.length === 0`، ويضبط `imageError` بدلاً من الانتظار حتى الخطوة 4.
  - عند `handleSubmit`, إذا لم توجد صور: ضبط `imageError`, الانتقال إلى الخطوة 1، وعدم الاكتفاء بـ `toast`.
  - عند أخطاء الجلسة/الدخول أثناء النشر: إبقاء المستخدم في الخطوة 4 وعرض رسالة ثابتة مع رابط/إجراء “تسجيل الدخول مرة أخرى” باستخدام `redirect=/add-property`، بدلاً من إعادة توجيه قسرية تفقده السياق.
  - تحديث نص الزر وفق المرحلة: `جاري التحضير...`, `جاري رفع الصور...`, `جاري تسجيل العقار...`, `جاري المحاولة مجدداً...`.

- في `src/services/supabaseService.ts`:
  - توسيع التوقيع إلى `createFullProperty(propertyData, imageFiles, userId, options?)`.
  - إضافة نوع خيارات مثل `CreateFullPropertyOptions` يحتوي `timeoutMs`, `maxRetries`, و`onStageChange`.
  - إضافة محاولة واحدة فقط لـ `supabase.auth.refreshSession()` إذا كانت `getSession()` فارغة أو كان `session.user.id !== userId`، ثم إعادة الفحص قبل الفشل.
  - تصنيف الأخطاء عبر `code` واضح يمكن للواجهة قراءته، مثل: `AUTH_REQUIRED`, `SESSION_EXPIRED`, `SESSION_MISMATCH`, `REQUEST_TIMEOUT`, `UPLOAD_FAILED`, `PROPERTY_CREATE_FAILED`.
  - استخدام `onStageChange` لإبلاغ الواجهة بمراحل العمل الفعلية من داخل الخدمة.
  - تطبيق تحمّل محدود وآمن: إعادة محاولة العمليات التمهيدية/القابلة للاسترداد فقط، وعدم إعادة محاولة `insert into properties` تلقائياً بعد مهلة غامضة لتجنب تكرار العقار.

- في الاختبارات:
  - تحديث اختبارات صفحة الإضافة لتتعامل مع `ProtectedRoute` و`useAuth` كما هو معمول به في صفحات محمية أخرى.
  - إضافة تغطية لمسار “لا توجد صور” في الخطوة 1 ومسار “الصور حُذفت ثم ضغط المستخدم نشر”.
  - إضافة تغطية لظهور `submitError` الثابت عند فشل الجلسة أو المهلة، مع عودة الزر من التحميل بدون فقد الرسالة.
  - إضافة اختبارات خدمة تؤكد: تحديث الجلسة مرة واحدة عند الانتهاء، ورمي أخطاء مصنفة، وإرسال مراحل التنفيذ للواجهة.

## التغييرات على الواجهات العامة
- `supabaseService.createFullProperty` سيقبل وسيطاً رابعاً اختيارياً للمرونة وحالة التنفيذ.
- سيتم التعامل مع أخطاء النشر باعتبارها أخطاء ذات `code` مقروء من الواجهة، وليس رسالة نصية عامة فقط.

## خطة الاختبار
- مستخدم غير مسجل يزور `/add-property` يتم توجيهه إلى `/auth?mode=login&redirect=/add-property`.
- المستخدم لا يستطيع الانتقال من الخطوة 1 بدون صورة واحدة على الأقل، ويرى رسالة واضحة داخل نفس الخطوة.
- عند فشل الجلسة أثناء النشر تظهر رسالة ثابتة في الخطوة 4 ولا تُفقد بيانات النموذج.
- نص زر النشر يتغيّر حسب المرحلة الفعلية القادمة من الخدمة.
- عند نجاح النشر يبقى السلوك الحالي كما هو: نجاح ثم الانتقال إلى `/my-properties`.
- عند `REQUEST_TIMEOUT` أو فشل الشبكة تعود حالة الزر لطبيعتها مع بقاء الرسالة المرئية حتى يعيد المستخدم المحاولة أو يعدّل المدخلات.

## الافتراضات المعتمدة
- اعتماد حماية عميل عبر `ProtectedRoute` هو الخيار الصحيح لهذا المشروع حالياً، وليس `middleware/proxy`.
- النطاق “الشامل” هنا يشمل تحسين المرونة والرسائل، لكنه يستبعد إعادة المحاولة العمياء للكتابة النهائية في قاعدة البيانات حفاظاً على عدم تكرار السجلات.
- الـ `toast` سيبقى موجوداً، لكن لن يكون وسيلة الإخطار الوحيدة في خطوة النشر بعد الآن.
